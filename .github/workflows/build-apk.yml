name: Build PANG APK - Easy Debug

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  debug:
    name: Build Installable Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PANG-Insurance-Platform-v2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PANG-Insurance-Platform-v2.0-debug-apk
          path: output/PANG-Insurance-Platform-v2.0-debug.apk
